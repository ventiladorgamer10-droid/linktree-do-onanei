<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Quarto Interativo Retro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Container proporcional para a imagem */
        .room-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 1 / 1.014;
        }

        .room-bg {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Áreas Clicáveis Invisíveis */
        .interactive-object {
            position: absolute;
            background: rgba(255, 255, 255, 0);
            border: 2px dashed transparent;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            border-radius: 4px;
        }

        /* Efeito de hover retro com brilho */
        .interactive-object:hover {
            background: rgba(0, 255, 200, 0.15);
            border-color: rgba(0, 255, 200, 0.6);
            box-shadow: 0 0 15px rgba(0, 255, 200, 0.4);
        }

        /* 📍 POSICIONAMENTO DOS OBJETOS */

        /* TV de Tubo (GTA Vice City) */
        #obj-tv {
            top: 24.5%;
            left: 7.5%;
            width: 28%;
            height: 22%;
        }

        /* 💻 Computador de Tubo Antigo (Seu Site) */
        #obj-pc {
            top: 31.5%;
            left: 57.5%;
            width: 15.5%;
            height: 11%;
        }

        /* Console PlayStation 2 */
        #obj-ps2 {
            top: 68%;
            left: 29%;
            width: 16%;
            height: 9%;
        }

        /* Caixa de Pizza */
        #obj-pizza {
            top: 63%;
            left: 3%;
            width: 22%;
            height: 20%;
        }

        /* Cama */
        #obj-bed {
            top: 45.5%;
            left: 63%;
            width: 37%;
            height: 35%;
        }

        /* Pôster do Linkin Park */
        #obj-poster-lp {
            top: 8%;
            left: 25.5%;
            width: 20%;
            height: 22%;
        }

        /* Pôster do Halo */
        #obj-poster-halo {
            top: 0%;
            left: 17%;
            width: 24%;
            height: 23%;
        }
    </style>
</head>
<body>

    <div class="room-container">
        <!-- Imagem de fundo do quarto retro -->
        <img src="https://imgur.com" alt="Quarto Anos 2000" class="room-bg">

        <!-- 🔗 Links dos Objetos -->
        <a href="#" target="_blank" class="interactive-object" id="obj-tv" title="Assistir Vídeos / YouTube"></a>
        
        <!-- Computador apontando para o seu site do Webnode -->
        <a href="https://meu-website-8djtj2.webnode.page" target="_blank" class="interactive-object" id="obj-pc" title="Site do Chefão"></a>
        
        <a href="#" target="_blank" class="interactive-object" id="obj-ps2" title="Meus Jogos / Discord"></a>
        <a href="#" target="_blank" class="interactive-object" id="obj-pizza" title="Apoie-me (Patreon / Pix)"></a>
        <a href="#" target="_blank" class="interactive-object" id="obj-bed" title="Meu Instagram / Pessoal"></a>
        <a href="#" target="_blank" class="interactive-object" id="obj-poster-lp" title="Minha Playlist / Spotify"></a>
        <a href="#" target="_blank" class="interactive-object" id="obj-poster-halo" title="Twitter / X"></a>
    </div>

</body>
</html>
